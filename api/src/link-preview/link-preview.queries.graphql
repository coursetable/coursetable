query courseMetadata($listingId: Int!) {
  listings_by_pk(listing_id: $listingId) {
    course_code
    section
    course {
      title
      description
      season_code
      credits
      areas
      skills
      course_meetings {
        days_of_week
        start_time
        end_time
      }
      course_professors {
        professor {
          name
        }
      }
    }
  }
}
