name: Staging CD

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'shared/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/staging_cd.yml'

  workflow_dispatch:
    inputs:
      api:
        description: 'Deploy API'
        type: boolean
      frontend:
        description: 'Deploy Frontend'
        type: boolean
      schema_ready:
        description: 'Database migration has been applied for this revision'
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.ref }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'shared/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/staging_cd.yml'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/staging_cd.yml'
            db:
              - 'api/drizzle/schema.ts'

      - name: Explain required schema rollout
        if: steps.filter.outputs.db == 'true' && inputs.schema_ready != true
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          API and frontend deployment paused because the database schema changed.
          Run **DB Migration** for **Staging** at this revision, then manually run
          this workflow with **Database migration has been applied for this revision** checked.
          EOF

  frontend-build-and-deploy:
    needs: [changes, api-build-and-deploy]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          (needs.changes.outputs.frontend == 'true' || inputs.frontend) &&
          (needs.changes.outputs.db == 'false' || inputs.schema_ready) &&
          (needs.api-build-and-deploy.result == 'success' ||
           needs.api-build-and-deploy.result == 'skipped') }}

    environment:
      name: Staging
      url: https://staging.coursetable.com
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - uses: dopplerhq/secrets-fetch-action@v1.2.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: coursetable
          doppler-config: prod_staging
          inject-env-vars: true
      - name: Build Frontend
        run: cd frontend && bun run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_KEY_VALUE }}
        run: |
          bunx wrangler pages deploy frontend/build --project-name=coursetable --branch=staging

  api-build-and-deploy:
    needs: changes
    if: >-
      ${{ (needs.changes.outputs.api == 'true' || inputs.api) &&
          (needs.changes.outputs.db == 'false' || inputs.schema_ready) }}

    environment:
      name: Staging
      url: https://staging.coursetable.com
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: dopplerhq/secrets-fetch-action@v1.2.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: coursetable
          doppler-config: prod_staging
          inject-env-vars: true

      - name: Build and Deploy Docker containers
        working-directory: ./api
        if: github.event_name == 'push'
        run: ./start.sh -s
        env:
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}

      - name: Build and Deploy Docker containers (Manual)
        working-directory: ./api
        if: github.event_name == 'workflow_dispatch'
        run: ./start.sh -s -o
        env:
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}

      - name: Verify API is responding before frontend deployment
        run: |
          curl --fail --silent --show-error --retry 12 --retry-connrefused \
            --retry-delay 5 --max-time 10 https://api-staging.coursetable.com/api/ping
